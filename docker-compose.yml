# docker compose up  ->  API em http://localhost:8000 (docs em /docs) e web em http://localhost:5173
# Portas ocupadas? API_PORT=18000 WEB_PORT=15173 docker compose up
services:
  api:
    build: ./backend
    ports: ["${API_PORT:-8000}:8000"]
    environment:
      FOGO_CORS: "http://localhost:${WEB_PORT:-5173},http://127.0.0.1:${WEB_PORT:-5173}"
    volumes: ["fogo-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  web:
    image: node:22-slim
    working_dir: /app
    # node_modules num volume nomeado: não suja a pasta frontend/ do host com arquivos de root
    volumes: ["./frontend:/app", "web-modules:/app/node_modules"]
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API: http://api:8000
    ports: ["${WEB_PORT:-5173}:5173"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  fogo-data:
  web-modules:
