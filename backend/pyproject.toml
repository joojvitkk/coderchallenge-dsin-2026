[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_functions = ["test_*", "teste_*"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "SIM", "C90", "PLR0915", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # define FOGO_RATE antes de importar o app

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 40

[tool.vulture]
paths = ["app", "simulator"]
min_confidence = 80
